<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smokey Joe's Poker — The dealer has notes.</title>

<meta name="description" content="Smokey Joe's Poker: an AI-dealt hold'em app for Android. Joe deals every hand and remembers every mistake. Join the waitlist." />

<meta property="og:title" content="Smokey Joe's Poker" />
<meta property="og:description" content="The dealer has notes. Coming soon to Android." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://smokeyjoespoker.com" />
<meta property="og:image" content="https://smokeyjoespoker.com/social-preview.png" />

<link rel="icon" href="/favicon.svg" type="image/svg+xml" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#0E1F1A;
  --bg-elevated:#142925;
  --bg-card:#1A322C;
  --ink:#F0E6D2;
  --ink-muted:#A8A092;
  --ember:#E89B3C;
  --hairline:rgba(240,230,210,0.08);
  --display:'Fraunces',serif;
  --body:'Inter',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --max:1080px;
  --gutter:clamp(20px,5vw,48px);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  line-height:1.55;
  overflow-x:hidden;
}
img{width:100%;height:100%;object-fit:cover;display:block}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}

.display{font-family:var(--display);letter-spacing:-0.02em}
.eyebrow{font-family:var(--mono);text-transform:uppercase;font-size:12px;color:var(--ember)}

header{padding:24px 0}
.brand{font-family:var(--display);font-weight:700}
.brand::before{content:"♠ ";color:var(--ember)}

.hero{padding:100px 0}
.hero-grid{display:grid;grid-template-columns:1.2fr 0.8fr;gap:60px}
@media(max-width:800px){.hero-grid{grid-template-columns:1fr}}

.portrait{
  aspect-ratio:4/5;
  border:1px solid var(--hairline);
  border-radius:6px;
  overflow:hidden;
  opacity:0;
  transform:translateY(20px);
  animation:fadeUp 1s ease forwards;
}

.character-card{
  aspect-ratio:3/4;
  border:1px solid var(--hairline);
  border-radius:6px;
  overflow:hidden;
}

@keyframes fadeUp{
  to{opacity:1;transform:translateY(0)}
}

/* VOICE */
.voice{
  font-family:var(--mono);
  border-left:2px solid var(--ember);
  padding:14px 16px;
  margin:30px 0;
  background:rgba(232,155,60,0.06);
}

/* WAITLIST */
.waitlist{display:flex;gap:10px;flex-wrap:wrap}
input{
  flex:1;
  padding:14px;
  border:1px solid var(--hairline);
  background:var(--bg-elevated);
  color:var(--ink);
}
button{
  padding:14px 20px;
  background:var(--ember);
  border:none;
  cursor:pointer;
}

/* SECTIONS */
section{padding:80px 0;border-top:1px solid var(--hairline)}

/* CAROUSEL */
.carousel{
  position:relative;
  overflow:hidden;
  border-radius:10px;
  border:1px solid var(--hairline);
  margin-top:40px;
}

.track{
  display:flex;
  transition:transform 0.5s ease;
}

.slide{
  min-width:100%;
  aspect-ratio:9/19;
  position:relative;
}

.carousel-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.4);
  color:white;
  border:none;
  padding:10px;
  cursor:pointer;
}

.prev{left:10px}
.next{right:10px}
</style>
</head>

<body>

<header>
  <div class="wrap">
    <div class="brand">Smokey Joe's Poker</div>
  </div>
</header>

<section class="hero">
  <div class="wrap hero-grid">

    <div>
      <div class="eyebrow">In development · Android</div>

      <h1 class="display" style="font-size:64px">
        The dealer has <em style="color:#E89B3C;font-style:italic">notes.</em>
      </h1>

      <p style="color:#A8A092;max-width:45ch">
        Smokey Joe deals every hand and remembers every mistake.
      </p>

      <div class="voice">“Sit down. Try not to embarrass yourself.”</div>

      <form class="waitlist" onsubmit="handleSignup(event)">
        <input type="email" placeholder="you@example.com" required>
        <button>Join waitlist</button>
      </form>
    </div>

    <div class="portrait">
      <img src="images/joe-portrait.png" loading="lazy" />
    </div>

  </div>
</section>

<section>
  <div class="wrap">
    <div class="eyebrow">The dealer</div>
    <h2 class="display">Meet Joe</h2>

    <div class="character-card">
      <img src="images/joe-character.png" loading="lazy" />
    </div>

    <div class="voice">“Oh. You called with that. Bold of you.”</div>
  </div>
</section>

<section>
  <div class="wrap">
    <h2 class="display">The app</h2>

    <div class="carousel">
      <div class="track" id="track">

        <div class="slide">
          <img src="images/screen1.png" loading="lazy">
        </div>

        <div class="slide">
          <img src="images/screen2.png" loading="lazy">
        </div>

        <div class="slide">
          <img src="images/screen3.png" loading="lazy">
        </div>

      </div>

      <button class="carousel-btn prev" onclick="move(-1)">‹</button>
      <button class="carousel-btn next" onclick="move(1)">›</button>
    </div>

  </div>
</section>

<section>
  <div class="wrap">
    <h2 class="display">Be the first to lose to Joe</h2>

    <form class="waitlist" onsubmit="handleSignup(event)">
      <input type="email" placeholder="you@example.com" required>
      <button>Join waitlist</button>
    </form>
  </div>
</section>

<script>
let index = 0;
const track = document.getElementById("track");

function move(dir){
  const total = track.children.length;
  index = (index + dir + total) % total;
  track.style.transform = `translateX(-${index * 100}%)`;
}

// auto-slide
setInterval(()=>move(1), 5000);

function handleSignup(e){
  e.preventDefault();
  alert("You're on the list. Joe is watching.");
}
</script>

</body>
</html>
